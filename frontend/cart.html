<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart — Car Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">VELOCE<span>MOTORS</span></a>
        <div class="nav-links">
            <a href="index.html#browse">Browse</a>
            <a href="accessories.html">Accessories</a>
            <a href="cart.html" id="cart-link" style="display:none;">Cart (<span id="cart-count">0</span>)</a>
            <a href="admin.html">Admin</a>
            <a href="login.html" id="auth-link">Login</a>
        </div>
    </nav>

    <div class="cart-wrap">
        <h2>Your Cart</h2>
        <div id="cart-items"><p>Loading...</p></div>
        <div id="cart-summary" style="display:none;">
    <p id="cart-total"></p>
    <div id="payment-form-wrap" style="display:none;">
        <div class="form-group">
    <label>Card Number</label>
    <div id="card-number-element" class="stripe-input"></div>
</div>
<div class="card-row">
    <div class="form-group">
        <label>Expiry</label>
        <div id="card-expiry-element" class="stripe-input"></div>
    </div>
    <div class="form-group">
        <label>CVC</label>
        <div id="card-cvc-element" class="stripe-input"></div>
    </div>
</div>
        <button id="pay-btn">Pay Now</button>
        <p id="payment-status"></p>
    </div>
    <button id="checkout-btn">Proceed to Payment</button>
</div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/cart.js"></script>

</html>
